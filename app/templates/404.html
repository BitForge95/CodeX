{% extends "layout.html" %}
{% load static %}

{% block content %}
<!-- Custom 404 Page Styles -->
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
    }

    #notfound {
        position: relative;
        height: 100vh;
    }

    .notfound {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 410px;
        width: 100%;
        text-align: center;
    }

    .notfound-404 {
        height: 280px;
        position: relative;
    }

    .not-found-h1 {
        font-family: 'Montserrat', sans-serif;
        font-size: 230px;
        margin: 0;
        font-weight: 900;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background: url("{% static 'img/bg.jpg' %}") no-repeat center;
        background-size: cover;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .notfound h2 {
        font-family: 'Montserrat', sans-serif;
        color: #000;
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 0;
    }

    .notfound p {
        font-family: 'Montserrat', sans-serif;
        color: #000;
        font-size: 14px;
        font-weight: 400;
        margin: 10px 0 20px;
    }

    .notfound a {
        font-family: 'Montserrat', sans-serif;
        font-size: 14px;
        text-decoration: none;
        text-transform: uppercase;
        background: #0046d5;
        padding: 15px 30px;
        border-radius: 40px;
        color: #fff;
        font-weight: 700;
        box-shadow: 0px 4px 15px -5px #0046d5;
        display: inline-block;
    }

    @media only screen and (max-width: 767px) {
        .notfound-404 {
            height: 142px;
        }

        .not-found-h1 {
            font-size: 112px;
        }
    }
</style>

<!-- 404 Content -->
<div id="notfound">
    <div class="notfound">
        <div class="notfound-404">
            <h1 class="not-found-h1">Oops!</h1>
        </div>
        <h2>404 - Page not found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="{% url 'read_all_blogs' %}">Go To Homepage</a>
    </div>
</div>
{% endblock %}
